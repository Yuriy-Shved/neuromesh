name: build-windows
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - run: cd flutter_app && flutter pub get && flutter build windows --release
      - run: Copy-Item "target\x86_64-pc-windows-msvc\release\neuromesh_core.dll" "flutter_app\build\windows\x64\runner\Release\" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: flutter_app/build/windows/x64/runner/Release/
