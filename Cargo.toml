[package]
name    = "neuromesh_core"
version = "2.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ed25519-dalek       = { version = "2", features = ["rand_core"] }
rand                = "0.8"
snow                = "0.10"
sha2                = "0.10"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
candle-core         = "0.8"
candle-nn           = "0.8"
candle-transformers = "0.8"
tokenizers          = "0.20"
anyhow              = "1"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
