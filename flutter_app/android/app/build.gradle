plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}
android {
    namespace "com.neuromesh"
    compileSdk 35
    defaultConfig {
        applicationId "com.neuromesh"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "2.0.0"
        ndk { abiFilters "arm64-v8a", "armeabi-v7a", "x86_64" }
    }
    buildTypes {
        release { signingConfig signingConfigs.debug }
    }
}
flutter { source '../..' }
